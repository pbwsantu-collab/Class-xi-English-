  <style>
    /* ---------- RESET & BASE ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0a2f5a 0%, #1a4a7a 40%, #2b6a9e 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ---------- WATER EFFECT (subtle waves) ---------- */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
                  radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 1;
    }

    /* ---------- MAIN CARD (floating) ---------- */
    .menu-card {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-radius: 60px 60px 40px 40px;
      padding: 2rem 2rem 2.6rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.06) inset;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 10;
      animation: float 6s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(0.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    /* ---------- HEADER ---------- */
    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #e0f0ff, #b0d4ff, #7bb8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
      letter-spacing: 1px;
      margin-bottom: 0.1rem;
      text-shadow: 0 0 40px rgba(100, 180, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .subhead {
      text-align: center;
      color: rgba(200, 225, 255, 0.7);
      font-weight: 300;
      letter-spacing: 2px;
      font-size: 1.05rem;
      margin-bottom: 2rem;
      border-bottom: 1px dashed rgba(200, 225, 255, 0.15);
      padding-bottom: 0.8rem;
    }

    /* ---------- MENU GRID (floating items) ---------- */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 18px;
      margin-top: 10px;
    }

    .menu-item {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 30px;
      padding: 1.2rem 0.6rem;
      text-align: center;
      color: #f0f4ff;
      font-weight: 600;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.3);
      transition: all 0.25s ease;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      line-height: 1.3;
      word-break: break-word;
      animation: itemFloat 4s ease-in-out infinite alternate;
      transform-origin: center;
    }

    /* Slight delay for each item to create a rippling effect */
    .menu-item:nth-child(1) { animation-delay: 0s; }
    .menu-item:nth-child(2) { animation-delay: 0.3s; }
    .menu-item:nth-child(3) { animation-delay: 0.6s; }
    .menu-item:nth-child(4) { animation-delay: 0.9s; }
    .menu-item:nth-child(5) { animation-delay: 1.2s; }
    .menu-item:nth-child(6) { animation-delay: 1.5s; }
    .menu-item:nth-child(7) { animation-delay: 1.8s; }
    .menu-item:nth-child(8) { animation-delay: 2.1s; }
    .menu-item:nth-child(9) { animation-delay: 2.4s; }

    @keyframes itemFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(0.5deg); }
    }

    .menu-item:hover {
      transform: scale(1.03) translateY(-8px);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(180, 220, 255, 0.5);
      box-shadow: 0 25px 40px -8px #000000aa, 0 0 0 2px rgba(180, 220, 255, 0.15);
    }

    .menu-item .icon {
      font-size: 2.3rem;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      margin-bottom: 2px;
    }

    .menu-item .label {
      background: rgba(0, 0, 0, 0.25);
      padding: 5px 14px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #e8eeff;
    }

    .menu-item .badge {
      font-size: 0.65rem;
      background: #4a8fc9;
      color: #ffffff;
      padding: 2px 12px;
      border-radius: 30px;
      font-weight: 700;
      margin-top: 4px;
      opacity: 0.9;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* ---------- COLORS FOR ITEMS (subtle underwater tones) ---------- */
    .menu-item:nth-child(1) { background: rgba(100, 180, 255, 0.12); }
    .menu-item:nth-child(2) { background: rgba(120, 200, 220, 0.12); }
    .menu-item:nth-child(3) { background: rgba(80, 200, 180, 0.12); }
    .menu-item:nth-child(4) { background: rgba(150, 170, 255, 0.12); }
    .menu-item:nth-child(5) { background: rgba(200, 160, 255, 0.12); }
    .menu-item:nth-child(6) { background: rgba(255, 180, 160, 0.12); }
    .menu-item:nth-child(7) { background: rgba(255, 200, 130, 0.12); }
    .menu-item:nth-child(8) { background: rgba(130, 220, 200, 0.12); }
    .menu-item:nth-child(9) { background: rgba(180, 200, 255, 0.12); }

    /* ---------- PLAYLIST & FOOTER ---------- */
    .playlist-bar {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 60px;
      padding: 10px 16px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .playlist-bar span {
      color: rgba(200, 225, 255, 0.6);
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .playlist-bar a {
      color: #aad0ff;
      text-decoration: none;
      font-size: 0.75rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 14px;
      border-radius: 30px;
      transition: all 0.2s;
    }

    .playlist-bar a:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .footer-note {
      margin-top: 2rem;
      text-align: center;
      color: rgba(200, 225, 255, 0.3);
      font-size: 0.75rem;
      letter-spacing: 1px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 1.2rem;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 580px) {
      .menu-card { padding: 1.5rem 1rem 1.8rem; }
      h1 { font-size: 2.2rem; }
      .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }

    @media (max-width: 420px) {
      .menu-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .menu-item { padding: 0.9rem 0.3rem; }
    }
  </style>
</head>

  <!-- PWA Service Worker (minimal) -->
  <script>
    (function() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', e => e.waitUntil(caches.open('classxi-v4').then(c => c.addAll(['/','index.html']))));
          self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl, { scope: '/' }).catch(() => {});
      }
    })();
  </script>
