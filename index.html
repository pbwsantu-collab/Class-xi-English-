  <style>
    /* ---------- reset & base ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #1a0b2e 0%, #2d1b4e 40%, #1f2a6b 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* -------- unicorn trail (moving sparkle) -------- */
    .unicorn-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .unicorn {
      position: absolute;
      font-size: 4.5rem;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.7)) drop-shadow(0 0 40px #ff8cff);
      animation: floatUnicorn 16s ease-in-out infinite alternate;
      transform-origin: center;
      will-change: transform, left, top;
      text-shadow: 0 0 30px #ffb3ff, 0 0 60px #a0f0ff;
      transition: transform 0.1s;
      line-height: 1;
      pointer-events: none;
    }

    @keyframes floatUnicorn {
      0% {
        left: -8%;
        top: 10%;
        transform: rotate(-5deg) scale(1.1);
      }
      12% {
        top: 30%;
        transform: rotate(8deg) scale(1.3);
      }
      25% {
        left: 20%;
        top: 60%;
        transform: rotate(-12deg) scale(1.2);
      }
      40% {
        left: 45%;
        top: 20%;
        transform: rotate(15deg) scale(1.5);
      }
      55% {
        left: 70%;
        top: 70%;
        transform: rotate(-8deg) scale(1.1);
      }
      70% {
        left: 85%;
        top: 30%;
        transform: rotate(10deg) scale(1.4);
      }
      85% {
        left: 60%;
        top: 80%;
        transform: rotate(-6deg) scale(1.2);
      }
      100% {
        left: 110%;
        top: 50%;
        transform: rotate(5deg) scale(1.6);
      }
    }

    /* -------- main card -------- */
    .menu-card {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 60px 60px 40px 40px;
      padding: 2rem 2rem 2.8rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 255, 255, 0.06) inset;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.25s;
      position: relative;
      z-index: 10;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffe99c, #ffb3ff, #9ee6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
      letter-spacing: 1px;
      margin-bottom: 0.1rem;
      text-shadow: 0 0 30px rgba(255, 200, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .subhead {
      text-align: center;
      color: rgba(255, 240, 255, 0.7);
      font-weight: 300;
      letter-spacing: 2px;
      font-size: 1.05rem;
      margin-bottom: 2rem;
      border-bottom: 1px dashed rgba(255, 220, 255, 0.2);
      padding-bottom: 0.8rem;
      backdrop-filter: blur(4px);
    }

    /* -------- grid menu -------- */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-top: 10px;
    }

    .menu-item {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 30px;
      padding: 1.2rem 0.8rem;
      text-align: center;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 25px -10px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      line-height: 1.3;
      word-break: break-word;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .menu-item:hover {
      transform: scale(1.02) translateY(-5px);
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 215, 150, 0.7);
      box-shadow: 0 20px 35px -8px #000000aa, 0 0 0 2px rgba(255, 200, 150, 0.3);
    }

    .menu-item .icon {
      font-size: 2.5rem;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
      margin-bottom: 2px;
    }

    .menu-item .label {
      background: rgba(0, 0, 0, 0.25);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f0eaff;
    }

    /* special colors for items */
    .menu-item:nth-child(1) { background: rgba(255, 140, 200, 0.2); }
    .menu-item:nth-child(2) { background: rgba(100, 200, 255, 0.18); }
    .menu-item:nth-child(3) { background: rgba(255, 215, 100, 0.2); }
    .menu-item:nth-child(4) { background: rgba(180, 130, 255, 0.2); }
    .menu-item:nth-child(5) { background: rgba(255, 160, 90, 0.2); }
    .menu-item:nth-child(6) { background: rgba(90, 220, 180, 0.2); }
    .menu-item:nth-child(7) { background: rgba(255, 100, 130, 0.2); }
    .menu-item:nth-child(8) { background: rgba(200, 180, 255, 0.2); }
    .menu-item:nth-child(9) { background: rgba(255, 220, 120, 0.2); }

    .menu-item .badge {
      font-size: 0.7rem;
      background: #ffb347;
      color: #1a0b2e;
      padding: 2px 12px;
      border-radius: 30px;
      font-weight: 700;
      margin-top: 4px;
      opacity: 0.9;
    }

    .footer-note {
      margin-top: 2rem;
      text-align: center;
      color: rgba(255, 230, 255, 0.4);
      font-size: 0.8rem;
      letter-spacing: 1px;

      padding-top: 1.2rem;
    }

    .footer-note span {
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 16px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
    }

    /* -------- responsive adjustments -------- */
    @media (max-width: 580px) {
      .menu-card { padding: 1.5rem 1rem 1.8rem; }
      h1 { font-size: 2.2rem; }
      .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .unicorn { font-size: 3.8rem; }
    }

    @media (max-width: 420px) {

      .menu-item { padding: 0.9rem 0.3rem; }
    }

  <!-- service worker registration for PWA (minimal) -->
  <script>
    (function() {
      // register service worker only if supported and not already registered
      if ('serviceWorker' in navigator) {
        // we create a minimal service worker inline via blob URL
        const swCode = `
          self.addEventListener('install', function(e) {
            e.waitUntil(
              caches.open('classxi-magic-v1').then(function(cache) {
                return cache.addAll([
                  '/',
                  'index.html'
                ]);
              })
            );
          });
          self.addEventListener('fetch', function(e) {
            e.respondWith(
              caches.match(e.request).then(function(response) {
                return response || fetch(e.request);
              })
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl, { scope: '/' })
          .then(() => console.log('🦄 PWA service worker registered (inline)'))
          .catch(() => console.log('SW registration skipped (non-critical)'));
      }

      // add a tiny sparkle effect on unicorn (extra flair)
      const unicorn = document.querySelector('.unicorn');
      if (unicorn) {
        setInterval(() => {
          // subtle glow pulse
          const glow = Math.sin(Date.now() / 800) * 0.2 + 0.8;
          unicorn.style.filter = `drop-shadow(0 0 ${20 + glow * 20}px rgba(255, 215, 0, ${0.5 + glow * 0.3})) drop-shadow(0 0 ${40 + glow * 30}px #ff8cff)`;
        }, 300);
      }
    })();
  </script>
